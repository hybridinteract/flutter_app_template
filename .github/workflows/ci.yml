name: Flutter CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code -- '*.g.dart' lib/core/l10n/generated

      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code (flutter analyze)
        run: flutter analyze --fatal-infos

      - name: Check architecture boundaries
        run: dart run tool/check_architecture.dart

      - name: Check agent config is in sync (.agent/, GEMINI.md)
        run: dart run tool/sync_agent_config.dart --check

      - name: Run unit & widget tests with coverage
        run: flutter test --coverage

      - name: Upload test coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14

  build-check:
    name: Build Verification
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env from the committed example
        run: cp .env.example .env

      - name: Build Android APK (Debug)
        run: flutter build apk --debug --dart-define-from-file=.env

