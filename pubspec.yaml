name: app_template
description: "A production-grade Flutter application template implementing Modular MVC + Clean Architecture principles."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  dio: ^5.9.0
  get_it: ^8.0.3
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  json_annotation: ^4.12.0
  intl: ^0.20.2
  firebase_core: ^3.10.0
  firebase_crashlytics: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.14
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  generate: true # gen-l10n: see l10n.yaml

  # assets:
  #   - assets/images/
  #   - assets/icons/
