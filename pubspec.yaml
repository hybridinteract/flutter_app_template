name: app_template
description: "A production-grade Flutter application template implementing Modular MVC + Clean Architecture principles."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0" # material_ui / cupertino_ui

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Material and Cupertino moved out of the SDK in Flutter 3.47; import
  # package:material_ui/material_ui.dart, never package:flutter/material.dart.
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  dio: ^5.9.0
  get_it: ^8.0.3
  go_router: ^18.1.4
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^4.0.7
  json_annotation: ^4.12.0
  intl: ^0.20.2
  firebase_core: ^3.10.0
  firebase_crashlytics: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.14
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  generate: true # gen-l10n: see l10n.yaml

  # assets:
  #   - assets/images/
  #   - assets/icons/
